{% extends "base.html" %}

{% block content %}
<main class="w-full max-w-[1040px] mx-auto px-3.5 pt-2.5 pb-2 md:px-[18px]">
  {% set saved_active = 'collections' %}
  {% include '_saved_header.html' %}

  <section id="collections-grid" class="grid w-full grid-cols-2 gap-x-2.5 gap-y-[18px] sm:grid-cols-3 sm:gap-x-3.5 sm:gap-y-6 lg:grid-cols-4 lg:gap-x-4 lg:gap-y-7"></section>

  <section id="collections-state" class="flex flex-col items-center gap-2 py-16 text-center" aria-live="polite">
    <div id="collections-state-icon" class="opacity-35"><span class="loading loading-spinner loading-md"></span></div>
    <div id="collections-state-title" class="text-sm font-semibold opacity-75">Loading collections</div>
    <p id="collections-state-copy" class="max-w-xs text-xs opacity-55">Your organization stays on this device.</p>
    <button id="collections-state-action" class="btn btn-sm mt-1" type="button" hidden></button>
  </section>
</main>

<dialog id="create-modal" class="modal" aria-labelledby="create-modal-title">
  <div class="modal-box">
    <h2 id="create-modal-title" class="text-lg font-bold">New Collection</h2>
    <fieldset class="fieldset mt-3 p-0">
      <legend class="fieldset-legend">Name</legend>
      <input id="create-name" class="input w-full" type="text" maxlength="80" placeholder="For example: Inspiration">
    </fieldset>
    <fieldset class="fieldset p-0">
      <legend class="fieldset-legend">Description</legend>
      <textarea id="create-description" class="textarea w-full" rows="3" maxlength="280" placeholder="Optional description"></textarea>
    </fieldset>
    <div class="modal-action">
      <button id="cancel-create" class="btn btn-sm" type="button">Cancel</button>
      <button id="submit-create" class="btn btn-primary btn-sm" type="button">Create</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Cancel">close</button></form>
</dialog>

<dialog id="rename-modal" class="modal" aria-labelledby="rename-modal-title">
  <div class="modal-box">
    <h2 id="rename-modal-title" class="text-lg font-bold">Rename Collection</h2>
    <fieldset class="fieldset mt-3 p-0">
      <legend class="fieldset-legend">Name</legend>
      <input id="rename-name" class="input w-full" type="text" maxlength="80" placeholder="Enter a new name">
    </fieldset>
    <div class="modal-action">
      <button id="cancel-rename" class="btn btn-sm" type="button">Cancel</button>
      <button id="submit-rename" class="btn btn-primary btn-sm" type="button">Save</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Cancel">close</button></form>
</dialog>
{% endblock %}

{% block extra_body %}
<script>
  (() => {
    const grid = document.getElementById('collections-grid');
    const stateEl = document.getElementById('collections-state');
    const stateIcon = document.getElementById('collections-state-icon');
    const stateTitle = document.getElementById('collections-state-title');
    const stateCopy = document.getElementById('collections-state-copy');
    const stateAction = document.getElementById('collections-state-action');
    const openBtn = document.getElementById('open-create-collection');
    const modal = document.getElementById('create-modal');
    const cancelBtn = document.getElementById('cancel-create');
    const submitBtn = document.getElementById('submit-create');
    const nameInput = document.getElementById('create-name');
    const descInput = document.getElementById('create-description');
    const renameModal = document.getElementById('rename-modal');
    const renameCancelBtn = document.getElementById('cancel-rename');
    const renameSubmitBtn = document.getElementById('submit-rename');
    const renameInput = document.getElementById('rename-name');
    const collectionsById = new Map();
    let renamingCollectionId = '';

    function showState(kind) {
      const states = {
        loading: ['Loading collections', 'Your organization stays on this device.', '', ''],
        empty: ['No collections yet', 'Create a collection for media you want to revisit.', 'Create Your First Collection', 'layers'],
        error: ['Collections could not be loaded', 'Check your connection and try again.', 'Reload', 'wifi-off'],
      };
      const [title, copy, action, icon] = states[kind] || states.loading;
      stateTitle.textContent = title;
      stateCopy.textContent = copy;
      stateAction.textContent = action;
      stateAction.hidden = !action;
      stateIcon.innerHTML = icon
        ? `<i data-feather="${icon}" class="size-6"></i>`
        : '<span class="loading loading-spinner loading-md"></span>';
      stateEl.hidden = false;
      feather.replace();
    }

    async function api(url, options = {}) {
      const response = await fetch(url, options);
      let payload = {};
      try {
        payload = await response.json();
      } catch (error) {
        payload = {};
      }
      if (!response.ok || !payload.success) {
        throw new Error(payload.error || 'Request failed');
      }
      return payload.data || {};
    }

    // The cover collage has no daisyUI equivalent, so its 1-4 tile layouts are
    // expressed as utility classes rather than a stylesheet keyed on a count.
    const COLLAGE_SPANS = {
      1: ['col-span-2 row-span-2'],
      2: ['row-span-2', 'row-span-2'],
      3: ['row-span-2', '', ''],
      4: ['', '', '', ''],
    };

    function renderCards(items) {
      if (!Array.isArray(items) || !items.length) {
        grid.replaceChildren();
        showState('empty');
        return;
      }
      stateEl.hidden = true;
      collectionsById.clear();
      grid.innerHTML = items.map((item) => {
        const id = String(item.id || '');
        collectionsById.set(id, item);
        const count = Number(item.item_count || 0);
        const detail = escapeHtml(String(item.detail_url || '#'));
        const name = escapeHtml(item.name || 'Untitled collection');
        const previewItems = Array.isArray(item.preview_items) ? item.preview_items.slice(0, 4) : [];
        let coverHtml;
        if (!previewItems.length) {
          coverHtml = '<div class="grid h-full w-full place-items-center opacity-25"><i data-feather="folder" class="size-7"></i></div>';
        } else {
          const spans = COLLAGE_SPANS[previewItems.length] || COLLAGE_SPANS[4];
          const tiles = previewItems.map((preview, index) => {
            const thumbUrl = escapeHtml(String(preview.thumb_url || ''));
            const videoMark = index === 0 && String(preview.type || '') === 'video'
              ? '<span class="absolute bottom-1 left-1 grid size-5 place-items-center rounded-full bg-black/45 text-white" aria-hidden="true"><i data-feather="play" class="size-2.5"></i></span>'
              : '';
            return `<span class="relative overflow-hidden bg-base-300 ${spans[index] || ''}"><img class="size-full object-cover transition-transform duration-200 group-hover:scale-[1.03]" src="${thumbUrl}" alt="" loading="lazy" decoding="async">${videoMark}</span>`;
          }).join('');
          coverHtml = `<div class="grid h-full w-full grid-cols-2 grid-rows-2 gap-0.5">${tiles}</div>`;
        }
        return `
          <article class="relative" data-collection-id="${id}">
            <a class="group block focus:outline-none" href="${detail}">
              <div class="aspect-[4/5] overflow-hidden rounded-box bg-base-200 ring-base-content/10 transition-transform duration-200 group-hover:-translate-y-0.5 group-focus-visible:ring-2">${coverHtml}</div>
              <div class="mt-2 px-0.5">
                <div class="truncate text-sm font-semibold">${name}</div>
                <div class="mt-0.5 text-xs opacity-55">${count} media items</div>
              </div>
            </a>
            <div class="dropdown dropdown-end absolute right-1.5 top-1.5">
              <button tabindex="0" class="btn btn-circle btn-xs border-0 bg-black/40 text-white hover:bg-black/60" type="button" aria-label="More actions for ${name}">
                <i data-feather="more-horizontal" class="size-3.5"></i>
              </button>
              <ul tabindex="0" class="dropdown-content menu z-10 w-36 rounded-box border border-base-300 bg-base-100 p-1 shadow-lg">
                <li><button type="button" data-action="rename" data-id="${id}">Rename</button></li>
                <li><button class="text-error" type="button" data-action="delete" data-id="${id}">Delete</button></li>
              </ul>
            </div>
          </article>
        `;
      }).join('');
      feather.replace();
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadCollections() {
      showState('loading');
      const data = await api('/api/collections');
      renderCards(data.items || []);
    }

    function openCreateModal() {
      nameInput.value = '';
      descInput.value = '';
      modal.showModal();
      nameInput.focus();
    }

    function openRenameModal(collectionId) {
      const id = String(collectionId || '').trim();
      const item = collectionsById.get(id);
      if (!id || !item) return;
      renamingCollectionId = id;
      renameInput.value = String(item.name || '').trim();
      renameModal.showModal();
      renameInput.select();
    }

    async function createCollection() {
      const name = String(nameInput.value || '').trim();
      const description = String(descInput.value || '').trim();
      if (!name) return;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating…';
      try {
        await api('/api/collections', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, description }),
        });
        modal.close();
        await loadCollections();
      } catch (error) {
        alert(error.message || 'Failed to create collection');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create';
      }
    }

    async function submitRenameCollection() {
      const collectionId = String(renamingCollectionId || '').trim();
      const name = String(renameInput.value || '').trim();
      if (!collectionId || !name) return;
      renameSubmitBtn.disabled = true;
      renameSubmitBtn.textContent = 'Saving…';
      try {
        await api(`/api/collections/${encodeURIComponent(collectionId)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        renameModal.close();
        await loadCollections();
      } catch (error) {
        alert(error.message || 'Failed to rename collection');
      } finally {
        renameSubmitBtn.disabled = false;
        renameSubmitBtn.textContent = 'Save';
      }
    }

    async function deleteCollection(collectionId) {
      const item = collectionsById.get(collectionId);
      if (!item) return;
      const ok = window.confirm(`Delete the collection "${String(item.name || 'Untitled collection')}"?`);
      if (!ok) return;
      try {
        await api(`/api/collections/${encodeURIComponent(collectionId)}`, { method: 'DELETE' });
        await loadCollections();
      } catch (error) {
        alert(error.message || 'Failed to delete collection');
      }
    }

    openBtn.addEventListener('click', openCreateModal);
    stateAction.addEventListener('click', () => {
      if (stateTitle.textContent === 'No collections yet') {
        openCreateModal();
        return;
      }
      loadCollections().catch(() => showState('error'));
    });

    cancelBtn.addEventListener('click', () => modal.close());
    renameModal.addEventListener('close', () => { renamingCollectionId = ''; });
    renameCancelBtn.addEventListener('click', () => renameModal.close());
    submitBtn.addEventListener('click', createCollection);
    renameSubmitBtn.addEventListener('click', submitRenameCollection);

    nameInput.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      createCollection();
    });
    renameInput.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      submitRenameCollection();
    });

    grid.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-action][data-id]');
      if (!button) return;
      event.preventDefault();
      // daisyUI dropdowns stay open while focused.
      document.activeElement?.blur();
      const action = String(button.getAttribute('data-action') || '').trim();
      const collectionId = String(button.getAttribute('data-id') || '').trim();
      if (!action || !collectionId) return;
      if (action === 'rename') {
        openRenameModal(collectionId);
        return;
      }
      if (action === 'delete') {
        await deleteCollection(collectionId);
      }
    });

    loadCollections().catch(() => showState('error'));
  })();
</script>
{% endblock %}
