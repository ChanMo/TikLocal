<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171815">
  <title>Sign in · {{ instance_name }}</title>
  <link rel="stylesheet" type="text/css" href="{{ static_asset('output.css') }}">
  <script src="{{ url_for('static', filename='retire_pwa.js') }}"></script>
  <script>
    // Applied before first paint so the sign-in screen opens in the same theme
    // as the rest of the app instead of always flashing light.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) { saved = null; }
      var preference = ['light', 'dark', 'system'].indexOf(saved) >= 0 ? saved : 'system';
      var resolved = preference === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : preference;
      document.documentElement.setAttribute('data-theme', resolved);
    })();
  </script>
</head>
<body class="min-h-dvh bg-base-200">
  <main class="grid min-h-dvh place-items-center p-4">
    <div class="w-full max-w-sm">
      <div class="mb-6 flex items-center justify-center gap-2.5">
        <span class="grid size-9 place-items-center rounded-full bg-primary text-primary-content text-xs font-bold">TL</span>
        <span class="text-lg font-semibold tracking-tight">TikLocal</span>
      </div>

      <div class="card bg-base-100 shadow-xl">
        <div class="card-body gap-5">
          <div>
            <h1 class="card-title text-2xl">Welcome back</h1>
            <p class="mt-1 text-sm opacity-60">Enter the access password to open your media library.</p>
          </div>

          {% if error %}
          <div role="alert" class="alert alert-error alert-soft text-sm">
            <span>{{ error }}</span>
          </div>
          {% endif %}

          <form method="post" action="{{ url_for('login_view') }}" class="flex flex-col gap-4">
            <input type="hidden" name="_csrf_token" value="{{ csrf_value }}">
            <input type="hidden" name="next" value="{{ next_url }}">

            <fieldset class="fieldset p-0">
              <legend class="fieldset-legend">Access password</legend>
              <label class="input w-full">
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="grow"
                  autocomplete="current-password"
                  required
                  aria-describedby="login-help"
                >
                <button
                  id="toggle-password"
                  class="btn btn-ghost btn-xs btn-circle"
                  type="button"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M2.5 12s3.4-5 9.5-5 9.5 5 9.5 5-3.4 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/>
                  </svg>
                </button>
              </label>
            </fieldset>

            <label class="label cursor-pointer justify-start gap-2.5 py-0">
              <input type="checkbox" name="remember" value="1" class="checkbox checkbox-sm" checked>
              <span class="label-text text-sm">Keep me signed in on this device</span>
            </label>

            <button class="btn btn-primary btn-block" type="submit">Sign in</button>
          </form>
        </div>
      </div>

      <p id="login-help" class="mt-5 text-center text-xs leading-relaxed opacity-55">
        Forgot the password? Run <code class="whitespace-nowrap rounded bg-base-300 px-1.5 py-0.5 font-mono">tiklocal auth set-password</code><br>
        on the computer hosting TikLocal.
      </p>
    </div>
  </main>

  <script>
    (function () {
      var input = document.getElementById('password');
      var toggle = document.getElementById('toggle-password');
      if (window.matchMedia('(min-width: 768px)').matches) input.focus({ preventScroll: true });
      toggle.addEventListener('click', function () {
        var showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        toggle.setAttribute('aria-pressed', String(!showing));
        toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        input.focus();
      });
    })();
  </script>
</body>
</html>
