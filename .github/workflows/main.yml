name: Test, build & publish

on:
  release:
    types: [published]
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Default, repo-wide token only needs read-access:
permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pip install --upgrade poetry
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        run: poetry run pytest -q

  radio:
    name: Check TikLocal Radio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/radio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/radio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Test Radio session
        run: npm test
      - name: Check Expo dependencies
        run: npx --yes expo-doctor@1.20.1
      - name: Bundle iOS production JavaScript
        run: >-
          npx expo export:embed --platform ios --dev false
          --entry-file index.ts
          --bundle-output "$RUNNER_TEMP/tiklocal-radio-ios.jsbundle"
          --assets-dest "$RUNNER_TEMP/tiklocal-radio-ios-assets"
      - name: Bundle Android production JavaScript
        run: >-
          npx expo export:embed --platform android --dev false
          --entry-file index.ts
          --bundle-output "$RUNNER_TEMP/tiklocal-radio-android.bundle"
          --assets-dest "$RUNNER_TEMP/tiklocal-radio-android-assets"

  build:
    name: Build dists with Poetry
    needs: [test, radio]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4       # pin major, first-party
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Poetry virtualenv
        uses: actions/cache@v4           # pin major, first-party
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/poetry.lock') }}
      - name: Install Poetry
        run: pip install --upgrade poetry
      - name: Build wheel & sdist
        run: poetry build
      - name: Upload dist/ as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-dists
          path: dist/

  publish-pypi:
    name: Upload to PyPI
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi            # must match the “Trusted Publisher” entry
      url: https://pypi.org/project/TikLocal/
    permissions:
      id-token: write       # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-dists
          path: dist/
      - name: Publish dists & attestations
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc
